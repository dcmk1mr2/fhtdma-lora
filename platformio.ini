; FH-TDMA LoRa firmware for LilyGO LoRa32 V2.1 and Heltec WiFi LoRa 32 V2/V3 (915 MHz)
; Build:   pio run -e <env>
; Flash:   pio run -e <env> -t upload     (env: lora32_v21, heltec_v3, heltec_v2)
; Monitor: pio device monitor

[platformio]
default_envs = heltec_v3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    jgromes/RadioLib@7.1.2
    mikalhart/TinyGPSPlus@1.1.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
build_flags =
    -Wall

; LilyGO T3 LoRa32 V2.1_1.6 (the common "V2" 915 MHz board)
[env:lora32_v21]
board = ttgo-lora32-v21
build_flags =
    ${env.build_flags}
    -DBOARD_LORA32_V21

; Heltec WiFi LoRa 32 V3 / V3.2 (ESP32-S3 + SX1262). Build with: pio run -e heltec_v3 -t upload
[env:heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_V3
lib_deps =
    ${env.lib_deps}
    ; Codec2 for ESP32 (the build Meshtastic uses), pinned
    https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip

; Heltec WiFi LoRa 32 V2 (SX1276). Build with: pio run -e heltec_v2 -t upload
[env:heltec_v2]
board = heltec_wifi_lora_32_V2
build_flags =
    ${env.build_flags}
    -DBOARD_HELTEC_V2
